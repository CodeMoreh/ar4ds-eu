name: Publish to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    env:
      # The copy of CRAN of the workshop's package date, as binaries for
      # this version of Ubuntu. The R setup hands the first address to renv as
      # its repository, so the versions of renv.lock install as binaries.
      RSPM: https://packagemanager.posit.co/cran/__linux__/noble/2026-11-17
      CRAN: https://packagemanager.posit.co/cran/2026-11-17
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Quarto is fixed at the version that renders the site locally.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"

      # index.qmd runs with freeze: false so the next-delivery toggle in
      # _variables.yml re-evaluates on every render; that one page therefore
      # executes R in CI. Everything else still comes from the committed
      # _freeze/ cache, so only the chunk-execution machinery, the yaml reader
      # and the two packages that the chunk of index.qmd calls (readr and
      # datawizard) are needed here. R is the version recorded in renv.lock,
      # and the packages come from the lockfile, at the versions of the
      # workshop's package date.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"
          use-public-rspm: true

      # The .Rprofile of the repository starts renv, which installs itself and
      # then restores the named packages with their dependencies.
      - name: Restore the R packages of the unfrozen page from the lockfile
        shell: Rscript {0}
        run: |
          renv::restore(packages = c("knitr", "rmarkdown", "yaml", "readr", "datawizard"), prompt = FALSE)

      - name: Render site
        run: quarto render

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
