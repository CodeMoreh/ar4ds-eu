project:
  type: website
  output-dir: _site
  # Anchored to the project root: an unanchored pattern such as `data/` matches
  # every folder of that name at any depth, including the licensed microdata
  # under _planning/ and the workspaces.
  resources:
    - /cases/*/data/
    - /data/
    - /assets/
  render:
    - "*.qmd"
    - "data/*.md"
    - "cases/**/*.qmd"
    - "cases/*/data/*.md"
    - "tracks/**/*.qmd"
    - "companion/*.qmd"
    - "slides/*.qmd"
    - "!_planning/**"
    - "!_planning_data/**"
    - "!_workspaces/**"
    # Rendered but left out of the navbar: the run sheet of the facilitator and
    # the notes on the formats
    - "facilitator/eu-frames-guide.qmd"
    - "facilitator/tracks.qmd"

# The docked sidebars of the formats live in their own file.
metadata-files:
  - _sidebar.yml

website:
  title: "AR4DS – EU frames"
  site-url: "https://codemoreh.github.io/ar4ds-eu/"
  repo-url: "https://github.com/CodeMoreh/ar4ds-eu"
  repo-actions: [issue]
  favicon: assets/logo.png
  # The previous and next links at the foot of each page of a format, in the
  # order of its sidebar
  page-navigation: true
  # Shown at the top of every page while the materials are being revised;
  # delete the block once they are stable. Not dismissable, so that it
  # appears on every page a visitor opens. It does not reach the reveal.js
  # decks, which have no site navigation.
  announcement:
    icon: exclamation-triangle
    dismissable: false
    type: warning
    position: above-navbar
    content: "**Under active development.** These course materials are being revised and may change at any time, so please do not rely on them as they currently stand."

  navbar:
    logo: assets/logo.png
    logo-alt: "CM logo"
    left:
      - href: index.qmd
        text: Home
      - text: The case
        menu:
          - href: cases/eu-frames/index.qmd
            text: "Case study"
          - href: cases/eu-frames/exercise.qmd
            text: "Exercise"
          - href: cases/eu-frames/lab.qmd
            text: "Browser lab"
          - href: cases/eu-frames/menu.qmd
            text: "Specification menu"
          - href: cases/eu-frames/map.qmd
            text: "Decision map"
          - href: cases/eu-frames/multiverse.qmd
            text: "Multiverse"
          - href: cases/eu-frames/cheatsheet.qmd
            text: "Cheatsheet"
      # Each format has a docked sidebar (_sidebar.yml) and a slides page that
      # embeds its deck; the decks themselves are not in the navbar.
      - text: Formats
        menu:
          - href: tracks/eu-frames-one-day/index.qmd
            text: "One-day workshop"
          - href: tracks/eu-frames-extended/index.qmd
            text: "Extended course"
          - text: "---"
          - href: tracks/self-study/index.qmd
            text: "Self-study"
      - text: Companion
        menu:
          - href: companion/index.qmd
            text: "Overview"
          - text: "---"
          - text: "Tools"
          # The modules on the tools live on the umbrella site; the two pages
          # of this site take them to the case
          - href: "https://codemoreh.github.io/ar4ds/tools/r.html"
            text: "Getting started with R"
          - href: companion/intro-r.qmd
            text: "R on the country-year panel"
          - href: "https://codemoreh.github.io/ar4ds/tools/ide.html"
            text: "Positron and other IDEs"
          - href: companion/ide.qmd
            text: "The workspace in the IDE"
          - href: "https://codemoreh.github.io/ar4ds/tools/quarto.html"
            text: "Quarto"
          - href: "https://codemoreh.github.io/ar4ds/git-github.html"
            text: "Git and GitHub"
          - href: "https://codemoreh.github.io/ar4ds/tools/ai.html"
            text: "AI assistants"
          - text: "---"
          - text: "Data and sharing"
          - href: companion/data-sources.qmd
            text: "Social science data sources"
          - href: companion/data-management.qmd
            text: "Building the analysis file"
          - href: companion/repositories.qmd
            text: "Reproducibility repositories"
          - text: "---"
          - text: "Methods"
          - href: companion/panel-data.qmd
            text: "Panel data"
          - href: companion/multilevel.qmd
            text: "Multilevel models"
          - href: companion/binary-outcomes.qmd
            text: "Binary outcomes"
          - href: companion/dags.qmd
            text: "Causal graphs and adjustment sets"
          - href: companion/measurement.qmd
            text: "The items behind the scales"
          - href: companion/weighting.qmd
            text: "Weights"
          - href: companion/missingness.qmd
            text: "Missing answers"
          - href: companion/bayesian.qmd
            text: "Bayesian estimation"
          - href: companion/meta-analysis.qmd
            text: "Meta-analysis"
          - href: companion/multiverse.qmd
            text: "The multiverse and its critics"
      - href: resources.qmd
        text: Resources
    right:
      # The pages that every case shares live on the umbrella site
      - href: "https://codemoreh.github.io/ar4ds/setup.html"
        text: Setup
      - href: "https://codemoreh.github.io/ar4ds/"
        text: AR4DS

  page-footer:
    left: |
      Content licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/).
      Data: aggregates only, the Eurobarometer files under the
      [GESIS terms of use](https://www.gesis.org/en/institute/data-usage-terms).
      [GitHub repository](https://github.com/CodeMoreh/ar4ds-eu)
    right: |
      Part of [AR4DS](https://codemoreh.github.io/ar4ds/). Built with [Quarto](https://quarto.org/)

filters:
  - highlight-text
  - more-fragments

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true

execute:
  freeze: auto
