project:
  type: website
  output-dir: _site
  # Anchored to the project root: an unanchored pattern such as `data/` matches
  # every folder of that name at any depth, including the licensed microdata
  # under _planning/ and the workspaces.
  resources:
    - /cases/*/data/
    - /data/
    - /assets/
  render:
    - "*.qmd"
    - "data/*.md"
    - "cases/**/*.qmd"
    - "cases/*/data/*.md"
    - "tracks/**/*.qmd"
    - "companion/*.qmd"
    - "slides/*.qmd"
    - "!_planning/**"
    - "!_planning_data/**"
    - "!_workspaces/**"
    - "facilitator/eu-frames-guide.qmd"   # rendered but not linked in the navbar
    - "facilitator/tracks.qmd"            # likewise: notes on the formats and their decks

# The docked sidebars of the six delivery tracks live in their own file.
metadata-files:
  - _sidebar.yml

website:
  title: "Applied Replication for Data Skills"
  site-url: "https://codemoreh.github.io/applied-replication/"
  repo-url: "https://github.com/CodeMoreh/applied-replication"
  repo-actions: [issue]
  favicon: assets/logo.png
  # Shown at the top of every page while the materials are being revised;
  # delete the block once they are stable. Not dismissable, so that it
  # appears on every page a visitor opens. It does not reach the reveal.js
  # decks, which have no site navigation.
  announcement:
    icon: exclamation-triangle
    dismissable: false
    type: warning
    position: above-navbar
    content: "**Under active development.** These course materials are being revised and may change at any time, so please do not rely on them as they currently stand."

  navbar:
    logo: assets/logo.png
    logo-alt: "CM logo"
    left:
      - href: index.qmd
        text: Home
      - text: Setup
        menu:
          - href: setup.qmd
            text: "Install and check"
          - href: help.qmd
            text: "Setup help"
      # The six delivery tracks. Each is a folder of participant-facing pages
      # with a docked sidebar (_sidebar.yml) and a slides page embedding the
      # deck that format runs on; the decks themselves are not in the navbar.
      - text: Tracks
        menu:
          - href: tracks/eu-frames-one-day-replication/index.qmd
            text: "One day – open science and replication"
          - href: tracks/eu-frames-one-day-tools/index.qmd
            text: "One day – social data science tools"
          - href: tracks/eu-frames-one-day-methods/index.qmd
            text: "One day – the statistical methods"
          - href: tracks/eu-frames-three-days/index.qmd
            text: "Three days"
          - href: tracks/eu-frames-semester/index.qmd
            text: "Semester"
          - href: tracks/eu-frames-self-study/index.qmd
            text: "Self-study"
      # The presentation of the case that every track starts from
      - href: cases/eu-frames/index.qmd
        text: "Case study"
      - text: Exercise
        menu:
          - href: cases/eu-frames/exercise.qmd
            text: Overview
          - href: cases/eu-frames/lab.qmd
            text: "Browser lab"
          - href: cases/eu-frames/menu.qmd
            text: Specification menu
          - href: cases/eu-frames/map.qmd
            text: Decision map
          - href: cases/eu-frames/cheatsheet.qmd
            text: Cheatsheet
      - href: cases/eu-frames/multiverse.qmd
        text: Multiverse
      # Grouped by the three strands of the curriculum – computational tools,
      # data management and sharing, statistical methods – with the
      # "---" entries drawing the dividers between them.
      - text: Companion
        menu:
          - href: companion/index.qmd
            text: "Curriculum overview"
          - text: "---"
          - text: "Computational tools"
          - href: companion/intro-r.qmd
            text: "Getting started with R"
          - href: companion/ide.qmd
            text: "Positron, RStudio and VS Code"
          - href: companion/quarto.qmd
            text: "Quarto and reproducible documents"
          - text: "---"
          - text: "Data management and sharing"
          - href: companion/data-sources.qmd
            text: "Social science data sources"
          - href: companion/data-management.qmd
            text: "Building the analysis file"
          - href: companion/repositories.qmd
            text: "Reproducibility repositories"
          - href: companion/git-github.qmd
            text: "Git & GitHub"
          - text: "---"
          - text: "Statistical methods"
          - href: companion/measurement.qmd
            text: "The items behind the scales"
          - href: companion/binary-outcomes.qmd
            text: "Binary outcomes"
          - href: companion/weighting.qmd
            text: "Weights"
          - href: companion/missingness.qmd
            text: "Missing answers"
          - href: companion/stats-methods.qmd
            text: "The statistical methods behind the course"
          - href: companion/dags.qmd
            text: "Causal graphs & adjustment sets"
          - href: companion/individual-level.qmd
            text: "The individual level"
          - href: companion/simulation.qmd
            text: "Simulation as a method"
          - href: companion/multiverse.qmd
            text: "The multiverse and its critics"
      - href: resources.qmd
        text: Resources

  page-footer:
    left: |
      Content licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) ·
      [GitHub repo](https://github.com/CodeMoreh/applied-replication)
    right: |
      Built with [Quarto](https://quarto.org/)

filters:
  - highlight-text
  - more-fragments

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    # shows the track chosen on the opening page as a navbar item on every page
    include-after-body: _includes/track-choice.html

execute:
  freeze: auto
