project:
  type: website
  output-dir: _site
  # Anchored to the project root: an unanchored pattern such as `data/` matches
  # every folder of that name at any depth, including the licensed microdata
  # under _planning/ and the IDE workspaces.
  resources:
    - /data/
    - /assets/
  render:
    - "*.qmd"
    - "data/*.md"
    - "tracks/**/*.qmd"
    - "companion/*.qmd"
    - "slides/*.qmd"
    - "live/*.qmd"
    - "!_planning/**"
    - "!_planning_data/**"
    # Kept in the repository and left out of the build until they are vetted:
    # the multi-day format, the four slide decks of its third day, the two modules that
    # only that day teaches, and the run sheets of the facilitator
    - "!tracks/long/"
    - "!slides/panel-data.qmd"
    - "!slides/multilevel.qmd"
    - "!slides/bayesian.qmd"
    - "!slides/report.qmd"
    - "!companion/multilevel.qmd"
    - "!companion/bayesian.qmd"
    - "!facilitator/"

# The docked sidebars of the formats live in their own file.
metadata-files:
  - _sidebar.yml

website:
  title: "AR4DS ②"
  # No search box: the pages are read in the order of a workflow, and search
  # would surface pages that are not meant to be found on their own
  search: false
  site-url: "https://codemoreh.github.io/ar4ds-eu/"
  repo-url: "https://github.com/CodeMoreh/ar4ds-eu"
  repo-actions: [issue]
  favicon: assets/logo.png
  # The previous and next links at the foot of each page of a format, in the
  # order of its sidebar
  page-navigation: true
  # Shown at the top of every page while the materials are being revised;
  # delete the block once they are stable. Not dismissable, so that it
  # appears on every page a visitor opens. It does not reach the reveal.js
  # slides, which have no site navigation.
  announcement:
    icon: exclamation-triangle
    dismissable: false
    type: warning
    position: above-navbar
    content: "**Under active development.** These workshop materials are being revised and may change at any time, so please do not rely on them as they currently stand."

  navbar:
    logo: assets/logo.png
    logo-alt: "CM logo"
    right:
      # Each item leads to a section of the opening page, which links the
      # full pages. The format that a visitor opened last is added before the
      # first item by _includes/track-choice.html. The pages of the Multiverse
      # (specification menu, curve, class results) are linked from the sidebar
      # of each format (_sidebar.yml).
      - href: index.qmd#case
        text: Case study
      - href: index.qmd#formats
        text: Formats
      - href: index.qmd#companion
        text: Companion
      - href: index.qmd#resources
        text: Resources
      # The pages that every case study shares live on the umbrella website
      - href: "https://codemoreh.github.io/ar4ds/"
        text: AR4DS

  # The footer: authorship and licence on the left, the tools that build the
  # pages in the centre, the source and the issue form on the right
  page-footer:
    left: |
      © 2026 [Chris Moreh](https://chrismoreh.com). Content licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/).
    center: |
      Built with [Quarto](https://quarto.org/) and [webR](https://docs.r-wasm.org/webr/latest/)
    right: |
      [<i class="bi bi-github"></i><span class="ft-text"> Source</span>](https://github.com/CodeMoreh/ar4ds-eu){title="The source on GitHub"} [<i class="bi bi-bug"></i><span class="ft-text"> Report an issue</span>](https://github.com/CodeMoreh/ar4ds-eu/issues/new){title="Report an issue on GitHub"}

filters:
  - highlight-text
  - more-fragments

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    # The format that a visitor last opened, as a navbar item on every page
    include-after-body: _includes/track-choice.html

execute:
  freeze: auto
