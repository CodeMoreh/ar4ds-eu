  page-footer:
    left: |
      Content licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) ·
      Data: housing audit, [CC0](https://doi.org/10.7910/DVN/1HOVTU) ·
      immigration and trust, derived from the European Social Survey,
      [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) ·
      EU frames, aggregates only, the Eurobarometer files under the
      [GESIS terms of use](https://www.gesis.org/en/institute/data-usage-terms) ·
      [GitHub repo](https://github.com/CodeMoreh/applied-replication)
    right: |
      Built with [Quarto](https://quarto.org/)

filters:
  - highlight-text
  - more-fragments
  # The line "Case: ..." at the top of every page under cases/<slug>/, of the
  # companion modules, and of any page that names its case in its front matter
  - style/case-label.lua

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    # shows the track chosen on the opening page as a navbar item on every page
    include-after-body: _includes/track-choice.html

execute:
  freeze: auto
