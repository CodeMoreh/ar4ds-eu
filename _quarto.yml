          - href: cases/trust/map.qmd
            text: "Decision map"
          - href: cases/trust/multiverse.qmd
            text: "Multiverse"
          - href: cases/trust/cheatsheet.qmd
            text: "Cheatsheet"
          - text: "---"
          - text: "The cohabitation case"
          - href: cases/cohabitation/index.qmd
            text: "Case study"
          - href: cases/cohabitation/exercise.qmd
            text: "Exercise"
          - href: cases/cohabitation/lab.qmd
            text: "Browser lab"
          - href: cases/cohabitation/menu.qmd
            text: "Specification menu"
          - href: cases/cohabitation/map.qmd
            text: "Decision map"
          - href: cases/cohabitation/multiverse.qmd
            text: "Multiverse"
          - href: cases/cohabitation/cheatsheet.qmd
            text: "Cheatsheet"
          - text: "---"
          - text: "The EU-frames case"
