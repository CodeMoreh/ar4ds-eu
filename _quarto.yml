project:
  type: website
  output-dir: _site
  # Anchored to the project root: an unanchored pattern such as `data/` matches
  # every folder of that name at any depth, including the licensed microdata
  # under _planning/ and the workspaces.
  resources:
    - /cases/*/data/
    - /data/
    - /assets/
  render:
    - "*.qmd"
    - "data/*.md"
    - "cases/**/*.qmd"
    - "cases/*/data/*.md"
    - "tracks/**/*.qmd"
    - "companion/*.qmd"
    - "slides/*.qmd"
    - "!_planning/**"
    - "!_planning_data/**"
    - "!_workspaces/**"
    # Rendered but left out of the navbar: the run sheets of the cases and the
    # notes on the formats and their decks
    - "facilitator/eu-frames-guide.qmd"
    - "facilitator/housing-guide.qmd"
    - "facilitator/trust-guide.qmd"
    - "facilitator/cohabitation-guide.qmd"
    - "facilitator/tracks.qmd"

# The docked sidebars of the delivery tracks live in their own file.
metadata-files:
  - _sidebar.yml

website:
  title: "Applied Replication for Data Skills"
  site-url: "https://codemoreh.github.io/applied-replication/"
  repo-url: "https://github.com/CodeMoreh/applied-replication"
  repo-actions: [issue]
  favicon: assets/logo.png
  # Shown at the top of every page while the materials are being revised;
  # delete the block once they are stable. Not dismissable, so that it
  # appears on every page a visitor opens. It does not reach the reveal.js
  # decks, which have no site navigation.
  announcement:
    icon: exclamation-triangle
    dismissable: false
    type: warning
    position: above-navbar
    content: "**Under active development.** These course materials are being revised and may change at any time, so please do not rely on them as they currently stand."

  navbar:
    logo: assets/logo.png
    logo-alt: "CM logo"
    left:
      - href: index.qmd
        text: Home
      - text: Setup
        menu:
          - href: setup.qmd
            text: "Install and check"
          - href: help.qmd
            text: "Setup help"
      # The cases in the order of the ladder, each a header followed by its
      # pages. An entry with text and no href is drawn as a header of the menu,
      # and "---" as a divider.
      - text: Cases
        menu:
          - text: "The housing-audit case"
          - href: cases/housing/index.qmd
            text: "Case study"
          - href: cases/housing/exercise.qmd
            text: "Exercise"
          - href: cases/housing/lab.qmd
            text: "Browser lab"
          - href: cases/housing/menu.qmd
            text: "Specification menu"
          - href: cases/housing/map.qmd
            text: "Decision map"
          - href: cases/housing/multiverse.qmd
            text: "Multiverse"
          - href: cases/housing/cheatsheet.qmd
            text: "Cheatsheet"
          - text: "---"
          - text: "The immigration-and-trust case"
