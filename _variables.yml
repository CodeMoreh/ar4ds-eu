# AR4DS, the EU-frames case – site variables.
#
# The one file to edit for site-wide facts and for scheduling a delivery. Pages
# read it through the Quarto shortcode {{< var name.subname >}}. Four parts:
#   1. Site-wide variables.
#   2. The case – the addresses of the workspace and of the class chart, which
#      the frozen class-results pipeline reads.
#   3. The delivery block – set delivery.active to 'true' to switch the
#      next-delivery callout on the home page on; set it back to 'false' for
#      the evergreen (no-date) site.
#   4. The last-delivery block – a record of the most recent delivery, kept
#      for the organiser and for the README. No page renders it.

# --- Site-wide variables ----------------------------------------------------
# `workshop` is the historical key; pages read it through
# {{< var workshop.name >}} and {{< var workshop.format >}}. The format string
# is rendered inside the eyebrow of the home page, so keep any replacement
# short.
workshop:
  name: "Applied Replication for Data Skills"
  format: "one day, three days or self-study"
  organiser: "Chris Moreh"
  # Add a public contact address here if you want one shown on the site.
  contact: ""

site-url: "https://codemoreh.github.io/ar4ds-eu/"
org: "https://github.com/CodeMoreh"
# The umbrella site, which holds the pages that every case shares: setup, the
# setup help, Git and GitHub, and the background on SCORE and Multi100.
umbrella: "https://codemoreh.github.io/ar4ds/"

# --- The case -----------------------------------------------------------------
# The frozen live-results pipeline (facilitator/live-results-setup.md). Do not
# rename or reformat these three keys: template-repo, live-results-url and
# results-form-url wire a working results pipeline end to end, and the pages,
# decks and workspace of the case read them under these names.
template-repo: "https://github.com/CodeMoreh/replication-lab"
# The multiverse page on which the class submissions appear live
live-results-url: "https://codemoreh.github.io/ar4ds-eu/cases/eu-frames/multiverse.html"
# The Google Form that every case submits to (frozen)
results-form-url: "https://forms.gle/MWhimagFDmGtprAPA"

# The same addresses under the slug of the case:
#   template-repo     the GitHub repository of the downloadable workspace
#   workspace-zip     the zip of that repository that participants download
#   live-results-url  the multiverse page that draws the class submissions
#   results-word      the word that follows the tag in every class-results
#                     label of the case; the EU-frames labels carry no case
#                     word (the frozen format), hence none here
cases:
  eu-frames:
    label: "EU frames"
    name: "the EU-frames case"
    template-repo: "https://github.com/CodeMoreh/replication-lab"
    workspace-zip: "https://github.com/CodeMoreh/replication-lab/archive/refs/heads/main.zip"
    live-results-url: "https://codemoreh.github.io/ar4ds-eu/cases/eu-frames/multiverse.html"
    results-word: ""

# --- Next-delivery block --------------------------------------------------
# Set active to 'true' to schedule a delivery; fill in the fields below.
# Set active back to 'false' to return the site to its evergreen state.
delivery:
  active: 'false'
  # Which format this delivery follows, named by its folder under tracks/:
  # eu-frames-one-day-open-science, eu-frames-one-day-data-tools,
  # eu-frames-one-day-methods, eu-frames-three-days or self-study. An empty
  # value prints no format line in the callout, and so does a value that
  # matches no folder.
  track: ""
  date: "Monday 3 August 2026, 10:00–18:00 EEST"
  venue: "Online"
  event: "Făgăraș Summer School"
  mode: "Online, free, open to all"
  registration_url: ""
  note: "Four 90-minute sessions – 10:00–11:30, 12:00–13:30, 14:30–16:00, 16:30–18:00, Romanian time (EEST, UTC+3). Install R and an IDE before the day – the [Setup](https://codemoreh.github.io/ar4ds/setup.html) page has the steps – and open the browser lab once, in case your machine will not cooperate on the day."

# --- Last delivery ---------------------------------------------------------
# A record of the most recent delivery, kept for the organiser and for the
# README. No page renders it.
last-delivery:
  event: "Făgăraș Summer School (online)"
  date: "3 August 2026"
