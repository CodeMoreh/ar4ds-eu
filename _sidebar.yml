# The docked sidebars of the formats of the Europeanisation case study. Each lists
# the pages of its own format in teaching order, and the previous and next links
# at the foot of each page follow that order. The sections Multiverse and Tools at the end
# of each sidebar give the pages of the multiverse and the tools by their full addresses: Quarto treats an
# absolute address as an external link, so the pages that the formats share (the
# browser lab, the cheatsheet) show no sidebar, and the previous and next links
# stop at the last page of the format. collapse-level 2 keeps both sections
# open. The pages under tracks/ and this file are edited by hand. The multi-day format
# (tracks/long/) is left out of the build, and so out of this file.
website:
  sidebar:
    - title: "Part-day"
      style: docked
      collapse-level: 2
      contents:
