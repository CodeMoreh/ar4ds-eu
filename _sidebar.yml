# The docked sidebars of the formats of the Europeanisation case study. Each lists
# the pages of its own format in teaching order, and the previous and next links
# at the foot of each page follow that order. The section Tools at the end of each
# sidebar gives the tools of the format by their full addresses: Quarto treats an
# absolute address as an external link, so the pages that the formats share (the
# browser lab, the cheatsheet) show no sidebar, and the previous and next links
# stop at the last page of the format. collapse-level 2 keeps the section Tools
# open. The pages under tracks/ and this file are edited by hand. Day 2 of the
# Extended course is the one-day workshop, whose pages stay in the sidebar of the
# workshop.
website:
