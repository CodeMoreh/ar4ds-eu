<!-- Behaviour of the opening page: the Choose and See-the-units controls of the
     track cards, the dialog that lists the units of a track, the primary
     button of the hero once a track is chosen, and the reveal on scroll. The
     cards themselves, their text and their unit lists are Markdown in
     index.qmd. Only a track card with a data-slug gets the controls, so the
     case cards are left as they are. The slugs are those of
     _includes/track-choice.html: the folder of each track under tracks/, such
     as housing-one-day, and semester for the track across the four cases. -->
<dialog class="home-dialog" id="home-units" aria-labelledby="home-units-title">
  <div class="home-dlg-head"><h3 id="home-units-title"></h3></div>
  <div class="home-dlg-body" id="home-units-body"></div>
  <div class="home-dlg-foot">
    <button type="button" id="home-units-close">Close</button>
    <button type="button" class="go" id="home-units-choose">Choose this track</button>
  </div>
</dialog>
<script>
(function () {
  var KEY = "ar-track";
  // The slugs that the EU-frames tracks had before they carried the case,
  // read as the slugs that replaced them, so that an earlier choice is still
  // recognised. "semester" is left out on purpose: it names the semester track
  // across the four cases (tracks/semester/), not the semester track of the
  // EU-frames case.
  var FORMER = {
    "one-day-replication": "eu-frames-one-day-replication",
    "one-day-tools": "eu-frames-one-day-tools",
    "one-day-methods": "eu-frames-one-day-methods",
    "three-days": "eu-frames-three-days",
    "self-study": "eu-frames-self-study"
  };
  var store = {
    get: function () {
      try {
        var v = localStorage.getItem(KEY);
        if (v && FORMER[v]) { v = FORMER[v]; localStorage.setItem(KEY, v); }
        return v;
      } catch (e) { return null; }
    },
    set: function (v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} }
  };
  var cards = Array.prototype.slice.call(document.querySelectorAll(".home-track[data-slug]"));
  var dlg = document.getElementById("home-units");
  var shown = null;

  function title(card) { var h = card.querySelector("h3"); return h ? h.textContent.trim() : ""; }

  cards.forEach(function (card) {
    var slug = card.getAttribute("data-slug");
    var actions = document.createElement("div");
    actions.className = "home-actions";
    var choose = document.createElement("button");
    choose.type = "button"; choose.className = "home-choose"; choose.textContent = "Choose";
    choose.addEventListener("click", function () { store.set(slug); paint(); });
    var units = document.createElement("button");
    units.type = "button"; units.className = "home-link"; units.textContent = "See the units";
    units.addEventListener("click", function () {
      shown = slug;
      document.getElementById("home-units-title").textContent = title(card);
      var list = card.querySelector(".home-units");
      document.getElementById("home-units-body").innerHTML = list ? list.innerHTML : "";
      if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    });
    actions.appendChild(choose); actions.appendChild(units);
    card.appendChild(actions);
  });

  document.getElementById("home-units-close").addEventListener("click", function () { dlg.close(); });
  document.getElementById("home-units-choose").addEventListener("click", function () {
    if (shown) store.set(shown); paint(); dlg.close();
  });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });

  var hero = document.querySelector(".home-cta a");
  var heroText = hero ? hero.textContent : "";
  var heroHref = hero ? hero.getAttribute("href") : "";

  function paint() {
    var slug = store.get();
    var chosen = null;
    cards.forEach(function (card) {
      var on = card.getAttribute("data-slug") === slug;
      if (on) chosen = card;
      card.classList.toggle("chosen", on);
      var b = card.querySelector(".home-choose");
      if (b) b.textContent = on ? "Chosen" : "Choose";
    });
    if (!hero) return;
    if (chosen) {
      var kase = chosen.getAttribute("data-case");
      hero.textContent = "Continue: " + title(chosen) + (kase ? " – " + kase : "");
      hero.setAttribute("href", "tracks/" + slug + "/index.html");
    } else {
      hero.textContent = heroText;
      hero.setAttribute("href", heroHref);
    }
  }
  paint();

  var items = document.querySelectorAll(".home-reveal");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    items.forEach(function (el) { io.observe(el); });
  } else {
    items.forEach(function (el) { el.classList.add("in"); });
  }
})();
</script>
