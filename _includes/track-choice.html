<!-- The track that a visitor chose on the opening page, shown as a navbar item
     on every page of the site. The choice lives in this browser only
     (localStorage key "ar-track"); with no choice, or with storage blocked,
     nothing is shown. Links use the quarto:offset meta tag, so they work from
     pages at any depth. Inline rather than a separate file for that reason. -->
<script>
(function () {
  // Slugs carry the case, as the folders under tracks/ do: <slug>-<format>.
  // The cross-case semester track will be "semester" (tracks/semester/); add
  // it here, in _includes/home-script.html and in _includes/next-delivery.qmd
  // when its folder exists. Until then a stored "semester" shows nothing.
  var TRACKS = {
    "housing-short": "Short session – housing audit",
    "housing-one-day": "One day – housing audit",
    "eu-frames-one-day-replication": "One day – open science and replication – EU frames",
    "eu-frames-one-day-tools": "One day – social data science tools – EU frames",
    "eu-frames-one-day-methods": "One day – the statistical methods – EU frames",
    "eu-frames-three-days": "Three days – EU frames",
    "eu-frames-semester": "Semester – EU frames",
    "eu-frames-self-study": "Self-study – EU frames"
  };
  // A choice stored under one of the slugs that the EU-frames tracks had
  // before they carried the case is read as the slug that replaced it, and
  // written back once. "semester" is not among them: it names the coming
  // cross-case track, not the semester track of the EU-frames case.
  var FORMER = {
    "one-day-replication": "eu-frames-one-day-replication",
    "one-day-tools": "eu-frames-one-day-tools",
    "one-day-methods": "eu-frames-one-day-methods",
    "three-days": "eu-frames-three-days",
    "self-study": "eu-frames-self-study"
  };
  var slug = null;
  try {
    slug = window.localStorage.getItem("ar-track");
    if (slug && FORMER[slug]) {
      slug = FORMER[slug];
      window.localStorage.setItem("ar-track", slug);
    }
  } catch (e) { return; }
  if (!slug || !TRACKS[slug]) return;
  var meta = document.querySelector('meta[name="quarto:offset"]');
  var base = meta ? meta.getAttribute("content") : "./";
  var nav = document.querySelector("#navbarCollapse .navbar-nav.ms-auto, #navbarCollapse .navbar-nav");
  if (!nav) return;
  var li = document.createElement("li");
  li.className = "nav-item";
  var a = document.createElement("a");
  a.className = "nav-link";
  a.href = base + "tracks/" + slug + "/index.html";
  a.title = "The track you chose on the opening page";
  a.innerHTML = '<i class="bi bi-signpost-split" aria-hidden="true"></i> <span class="menu-text">Your track: ' + TRACKS[slug] + "</span>";
  li.appendChild(a);
  nav.appendChild(li);
})();
</script>
