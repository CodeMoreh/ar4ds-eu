<!-- The track that a visitor last opened, shown as a navbar item on every page
     of the site, so that someone who follows a link out of a track can find it
     again. A page under tracks/<slug>/ records its slug in this browser only
     (localStorage key "ar-track"); with no track opened yet, or with storage
     blocked, nothing is shown. The facilitator chooses the track of a delivery
     (_planning/formats-2026-10-27.md), so there is no button that chooses one.
     Links use the quarto:offset meta tag, so they work from pages at any depth.
     Inline rather than a separate file for that reason. -->
<script>
(function () {
  // The folders under tracks/, which _includes/next-delivery.qmd and the
  // delivery block of _variables.yml name in the same way.
  var TRACKS = {
    "housing-short": "Short session – housing audit",
    "housing-one-day-open-science": "One day, open science – housing audit",
    "housing-one-day-data-tools": "One day, data tools – housing audit",
    "housing-one-day-methods": "One day, methods – housing audit",
    "eu-frames-one-day-open-science": "One day, open science – EU frames",
    "eu-frames-one-day-data-tools": "One day, data tools – EU frames",
    "eu-frames-one-day-methods": "One day, methods – EU frames",
    "trust-three-days": "Three days – immigration and trust",
    "cohabitation-three-days": "Three days – cohabitation",
    "eu-frames-three-days": "Three days – EU frames",
    "self-study": "Self-study – four cases"
  };
  var KEY = "ar-track";
  var slug = null;
  try {
    var here = window.location.pathname.match(/\/tracks\/([a-z0-9-]+)\//);
    if (here && TRACKS[here[1]]) window.localStorage.setItem(KEY, here[1]);
    slug = window.localStorage.getItem(KEY);
  } catch (e) { return; }
  if (!slug || !TRACKS[slug]) return;
  var meta = document.querySelector('meta[name="quarto:offset"]');
  var base = meta ? meta.getAttribute("content") : "./";
  var nav = document.querySelector("#navbarCollapse .navbar-nav.ms-auto, #navbarCollapse .navbar-nav");
  if (!nav) return;
  var li = document.createElement("li");
  li.className = "nav-item";
  var a = document.createElement("a");
  a.className = "nav-link";
  a.href = base + "tracks/" + slug + "/index.html";
  a.title = "The track you opened last";
  a.innerHTML = '<i class="bi bi-signpost-split" aria-hidden="true"></i> <span class="menu-text">Your track: ' + TRACKS[slug] + "</span>";
  li.appendChild(a);
  nav.appendChild(li);
})();
</script>
